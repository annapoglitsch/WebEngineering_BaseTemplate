server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward the health endpoint to the Fastify API
    location = /health {
        proxy_pass http://api:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward API requests to Fastify
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve the React app and support client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
